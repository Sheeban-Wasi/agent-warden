[project]
name = "agent-warden"
version = "0.1.0"
description = "Security middleware for AI agents - AST-based SQL protection, PII redaction, and permission enforcement"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Agent-Warden Contributors"}
]
keywords = [
    "ai",
    "agents",
    "security",
    "middleware",
    "sql-injection",
    "pii",
    "aws-strands",
    "langchain",
    "llm",
    "guardrails",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "sqlglot>=26.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
pii = [
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
]
strands = [
    "strands-agents>=0.1.0",
]
langchain = [
    "langchain-core>=0.2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]
all = [
    "agent-warden[pii,strands,langchain,dev]",
]

[project.urls]
Homepage = "https://github.com/your-org/agent-warden"
Documentation = "https://github.com/your-org/agent-warden#readme"
Repository = "https://github.com/your-org/agent-warden"
Issues = "https://github.com/your-org/agent-warden/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["warden"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
